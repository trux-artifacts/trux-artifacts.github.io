<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc">
  <title id="title">AndroSpecter architecture</title>
  <desc id="desc">Android application inputs enter AndroSpecter through its Java API or command-line interface. Metadata, managed analysis, graph inspection, taint analysis, and instrumentation produce detached reports and graph exports.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#6d8295"/>
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="7" stdDeviation="8" flood-color="#20384d" flood-opacity="0.10"/>
    </filter>
    <style>
      text { font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .eyebrow { fill: #7a8b9a; font-size: 13px; font-weight: 750; letter-spacing: 1.4px; }
      .input-title { fill: #263b4f; font-size: 17px; font-weight: 750; }
      .input-sub { fill: #718394; font-size: 12px; }
      .module-title { fill: #24394d; font-size: 15px; font-weight: 750; }
      .module-sub { fill: #6f8191; font-size: 11px; }
      .output-title { fill: #24394d; font-size: 14px; font-weight: 750; }
      .output-sub { fill: #748696; font-size: 11px; }
    </style>
  </defs>

  <rect width="1200" height="560" rx="24" fill="#f8faf9"/>
  <path d="M28 32h1144" stroke="#e4ebe7"/>

  <text class="eyebrow" x="50" y="76">ANALYSIS INPUTS</text>
  <text class="eyebrow" x="376" y="76">REUSABLE ANALYSIS LAYER</text>
  <text class="eyebrow" x="934" y="76">DETACHED OUTPUTS</text>

  <g filter="url(#shadow)">
    <rect x="50" y="108" width="222" height="78" rx="13" fill="#ffffff" stroke="#dce5e0"/>
    <rect x="50" y="206" width="222" height="78" rx="13" fill="#ffffff" stroke="#dce5e0"/>
    <rect x="50" y="304" width="222" height="78" rx="13" fill="#ffffff" stroke="#dce5e0"/>
  </g>
  <g transform="translate(71 132)">
    <path d="M1 1h23l9 9v32H1z" fill="#e7f6ed" stroke="#07884f" stroke-width="1.7"/>
    <path d="M24 1v10h9" fill="none" stroke="#07884f" stroke-width="1.7"/>
    <text class="input-title" x="50" y="13">Android APK</text>
    <text class="input-sub" x="50" y="34">Manifest and DEX bytecode</text>
  </g>
  <g transform="translate(71 230)">
    <rect x="1" y="2" width="32" height="39" rx="4" fill="#edf2f7" stroke="#526d82" stroke-width="1.7"/>
    <path d="M8 12h18M8 20h18M8 28h12" stroke="#526d82" stroke-width="1.7" stroke-linecap="round"/>
    <text class="input-title" x="50" y="13">Android platforms</text>
    <text class="input-sub" x="50" y="34">SDK JARs for analysis</text>
  </g>
  <g transform="translate(71 328)">
    <path d="M4 4h28v34H4z" fill="#fff3e8" stroke="#d85d3f" stroke-width="1.7"/>
    <path d="M10 13h16M10 21h16M10 29h10" stroke="#d85d3f" stroke-width="1.7" stroke-linecap="round"/>
    <text class="input-title" x="50" y="13">Analysis settings</text>
    <text class="input-sub" x="50" y="34">Scope, sources, sinks, limits</text>
  </g>

  <path d="M286 245h58" fill="none" stroke="#6d8295" stroke-width="2.2" marker-end="url(#arrow)"/>

  <g filter="url(#shadow)">
    <rect x="360" y="94" width="502" height="382" rx="18" fill="#ffffff" stroke="#cfdcd5"/>
  </g>
  <path d="M378 94h466a18 18 0 0 1 18 18v64H360v-64a18 18 0 0 1 18-18z" fill="#24394d"/>
  <g transform="translate(390 113)">
    <path d="M11 7 5 0M37 7l6-7" stroke="#3bd28a" stroke-width="3.5" stroke-linecap="round"/>
    <path d="M5 22C5 10 13 5 24 5s19 5 19 17v16c0 8-5 13-11 13-4 0-6-2-8-5-2 3-4 5-8 5C10 51 5 46 5 38z" fill="#11a461"/>
    <circle cx="17" cy="23" r="2.7" fill="#ffffff"/>
    <circle cx="31" cy="23" r="2.7" fill="#ffffff"/>
    <circle cx="24" cy="34" r="2.5" fill="#ffffff"/>
    <circle cx="15" cy="42" r="2.5" fill="#ffffff"/>
    <circle cx="33" cy="42" r="2.5" fill="#ffffff"/>
    <path d="M24 36v5M22 35l-6 6M26 35l6 6" stroke="#ffffff" stroke-width="1.5"/>
  </g>
  <text x="460" y="132" fill="#ffffff" font-size="27" font-weight="800">AndroSpecter</text>
  <text x="460" y="156" fill="#c8d6e1" font-size="13">Soot and FlowDroid behind a controlled, reusable interface</text>

  <rect x="389" y="195" width="105" height="31" rx="15.5" fill="#e8f7ef" stroke="#b9e3cd"/>
  <text x="441.5" y="215" text-anchor="middle" fill="#087545" font-size="12" font-weight="750">JAVA API</text>
  <rect x="504" y="195" width="80" height="31" rx="15.5" fill="#eef3f7" stroke="#d5e0e8"/>
  <text x="544" y="215" text-anchor="middle" fill="#3d596f" font-size="12" font-weight="750">CLI</text>
  <text x="820" y="215" text-anchor="end" fill="#788998" font-size="11.5">same core capabilities</text>

  <g>
    <rect x="389" y="248" width="205" height="76" rx="11" fill="#f6f9fb" stroke="#dae4eb"/>
    <circle cx="416" cy="275" r="13" fill="#e8f7ef"/>
    <path d="M409 275h14M416 268v14" stroke="#07884f" stroke-width="1.8" stroke-linecap="round"/>
    <text class="module-title" x="440" y="277">APK metadata</text>
    <text class="module-sub" x="407" y="303">ApkInfo · no Soot session</text>

    <rect x="626" y="248" width="207" height="76" rx="11" fill="#f6f9fb" stroke="#dae4eb"/>
    <circle cx="653" cy="275" r="13" fill="#eef3f7"/>
    <path d="M646 279c4-12 10-12 14 0M647 272h12" fill="none" stroke="#44657d" stroke-width="1.8" stroke-linecap="round"/>
    <text class="module-title" x="677" y="277">Managed analysis</text>
    <text class="module-sub" x="644" y="303">AndroidAnalysis lifecycle</text>

    <rect x="389" y="344" width="205" height="76" rx="11" fill="#f6f9fb" stroke="#dae4eb"/>
    <circle cx="416" cy="371" r="13" fill="#fff1eb"/>
    <circle cx="410" cy="369" r="2.5" fill="#d85d3f"/>
    <circle cx="422" cy="365" r="2.5" fill="#d85d3f"/>
    <circle cx="422" cy="378" r="2.5" fill="#d85d3f"/>
    <path d="M412 368l8-3M412 371l8 6" stroke="#d85d3f" stroke-width="1.6"/>
    <text class="module-title" x="440" y="373">Graphs and inspection</text>
    <text class="module-sub" x="407" y="399">Query · filter · compare</text>

    <rect x="626" y="344" width="207" height="76" rx="11" fill="#f6f9fb" stroke="#dae4eb"/>
    <circle cx="653" cy="371" r="13" fill="#f1edfb"/>
    <path d="M646 371h14M653 364v14" stroke="#7961aa" stroke-width="1.8" stroke-linecap="round"/>
    <text class="module-title" x="677" y="373">Taint and transforms</text>
    <text class="module-sub" x="644" y="399">Findings · instrumentation</text>
  </g>

  <path d="M876 245h43" fill="none" stroke="#6d8295" stroke-width="2.2" marker-end="url(#arrow)"/>

  <g filter="url(#shadow)">
    <rect x="934" y="108" width="216" height="70" rx="12" fill="#ffffff" stroke="#dce5e0"/>
    <rect x="934" y="194" width="216" height="70" rx="12" fill="#ffffff" stroke="#dce5e0"/>
    <rect x="934" y="280" width="216" height="70" rx="12" fill="#ffffff" stroke="#dce5e0"/>
    <rect x="934" y="366" width="216" height="70" rx="12" fill="#ffffff" stroke="#dce5e0"/>
  </g>
  <circle cx="961" cy="143" r="14" fill="#e8f7ef"/>
  <path d="M955 143h12M961 137v12" stroke="#07884f" stroke-width="1.8" stroke-linecap="round"/>
  <text class="output-title" x="985" y="140">APK information</text>
  <text class="output-sub" x="985" y="157">components · permissions</text>

  <circle cx="961" cy="229" r="14" fill="#eef3f7"/>
  <path d="M955 225h12M955 233h12" stroke="#44657d" stroke-width="1.8" stroke-linecap="round"/>
  <text class="output-title" x="985" y="226">Graph snapshots</text>
  <text class="output-sub" x="985" y="243">paths · callers · callees</text>

  <circle cx="961" cy="315" r="14" fill="#fff1eb"/>
  <path d="m955 315 4 4 8-9" fill="none" stroke="#d85d3f" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
  <text class="output-title" x="985" y="312">Taint findings</text>
  <text class="output-sub" x="985" y="329">status · endpoints · paths</text>

  <circle cx="961" cy="401" r="14" fill="#f1edfb"/>
  <path d="M955 397h12v9h-12zM958 394h6" fill="none" stroke="#7961aa" stroke-width="1.7" stroke-linecap="round"/>
  <text class="output-title" x="985" y="398">Portable exports</text>
  <text class="output-sub" x="985" y="415">JSON · DOT · offline HTML</text>

  <rect x="360" y="494" width="790" height="40" rx="10" fill="#eaf5ef"/>
  <circle cx="386" cy="514" r="8" fill="#07884f"/>
  <path d="m382 514 3 3 5-6" fill="none" stroke="#ffffff" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="405" y="519" fill="#315948" font-size="13" font-weight="650">Detached results stay available after the underlying analysis session closes</text>
</svg>
