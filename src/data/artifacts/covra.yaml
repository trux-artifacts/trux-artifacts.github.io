name: CovRA
type: tool
area: Android Static & Dynamic Analysis
description: >-
  A live Android code coverage analyzer for manual testing. CovRA continuously
  reports coverage across seven granularities, updates a simplified Window
  Transition Graph, and identifies reached and unreached code elements. With
  optional JADX integration, testers can inspect decompiled Java source
  directly in the interface.
cardDescription: Tracks live Android code coverage and guides testers toward unexplored application states.
authors:
  - Pedro Jesús Ruiz Jiménez
  - Huynh Tuan Khoi Nguyen
  - Jordan Samhi
  - Tegawendé F. Bissyandé
  - Jacques Klein
addedAt: '2026-10-24'
logo: android
figure: covra.png
figureCaption: >-
  CovRA workflow from AndroLog instrumentation and device logging to APK
  analysis, WTG construction, and continuously updated coverage feedback.
links:
  github: https://github.com/Trustworthy-Software/CovRA
  download: https://raw.githubusercontent.com/Trustworthy-Software/CovRA/main/artifacts/covra-1.0.0.jar
  video: https://www.youtube.com/watch?v=ikExB22oEOI
  resources:
    - label: Android Studio plugin
      url: https://raw.githubusercontent.com/Trustworthy-Software/CovRA/main/artifacts/covra-android-studio-plugin-1.0.0.zip
    - label: Sample session
      url: https://github.com/Trustworthy-Software/CovRA/tree/main/samples
tags:
