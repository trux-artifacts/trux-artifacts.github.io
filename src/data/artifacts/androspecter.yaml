name: AndroSpecter
type: library
area: Android Static & Dynamic Analysis
description: >-
  Android static analysis as a Java library or command-line tool. AndroSpecter
  wraps Soot and FlowDroid to read APK metadata, build and query call graphs,
  run source-to-sink taint analyses, export graphs, and compose instrumentation.
cardDescription: A Java library and CLI for Android call graphs, taint analysis, inspection, and instrumentation.
authors:
  - Jordan Samhi
logo: android
addedAt: '2026-07-06'
links:
  github: https://github.com/JordanSamhi/AndroSpecter
  website: https://github.com/JordanSamhi/AndroSpecter/wiki
  resources:
    - label: Getting started
      url: https://github.com/JordanSamhi/AndroSpecter/wiki/Getting-started
    - label: Runnable examples
      url: https://github.com/JordanSamhi/AndroSpecter/tree/main/examples
    - label: Live call-graph report
      url: https://jordansamhi.com/static/demos/androspecter/callgraph.html
    - label: Maven Central · 1.1.8
      url: https://central.sonatype.com/artifact/com.jordansamhi/androspecter/1.1.8
tags:
  - android
  - static-analysis
  - call-graph
  - taint-analysis
  - instrumentation
figure: androspecter.svg
figureCaption: >-
  AndroSpecter offers the same Android-analysis building blocks through a managed
  Java API and a standalone CLI, with detached results that remain usable after
  the underlying Soot session closes.
demo:
  style: code
  engineLabel: AndroSpecter Java API
  intro: >-
    Explore three workflows adapted from AndroSpecter's official runnable
    examples: inspect an APK without Soot, build a managed call graph, and obtain
    structured FlowDroid taint results.
  note: >-
    Precomputed code walkthrough adapted from the official repository examples;
    no Java or Android analysis runs in the browser. The snippets follow the
    current source tree; Maven Central separately lists the latest published
    library release.
  scenarios:
    - label: Read APK metadata
      query: Read package, SDK, permission, and component declarations directly from an APK.
      file: PrintApkInfo.java
      pattern: Java
      thinking:
        - No Android SDK required
        - No Soot session initialized
        - Detached manifest metadata
      output:
        - 'import com.jordansamhi.androspecter.metadata.ApkInfo;'
        - 'import java.nio.file.Path;'
        - ''
        - 'ApkInfo info = ApkInfo.read(Path.of("app.apk"));'
        - ''
        - 'System.out.println(info.packageName());'
        - 'System.out.println(info.minSdkVersion());'
        - 'System.out.println(info.targetSdkVersion());'
        - 'System.out.println(info.permissions());'
        - ''
        - 'info.components().forEach(component ->'
        - '    System.out.printf("%s  %s%n",'
        - '        component.kind(), component.name()));'
      explanation: >-
        ApkInfo parses the binary manifest without initializing Soot. The returned
        package, SDK, permission, and component records are ordinary detached data.
    - label: Build a call graph
      query: Open one managed analysis session, build the Android call graph, then query its detached snapshot.
      file: QuickStart.java
      pattern: Java
      thinking:
        - Managed Soot lifecycle
        - Android entry points included
        - Snapshot survives session close
      output:
        - 'import com.jordansamhi.androspecter.analysis.AndroidAnalysis;'
        - 'import com.jordansamhi.androspecter.graph.CallGraphSnapshot;'
        - 'import java.nio.file.Path;'
        - ''
        - 'CallGraphSnapshot graph;'
        - 'try (AndroidAnalysis analysis = AndroidAnalysis.open('
        - '        Path.of("app.apk"),'
        - '        Path.of("/android-sdk/platforms"))) {'
        - '    System.out.println(analysis.packageName());'
        - '    graph = analysis.callGraph();'
        - '}'
        - ''
        - 'System.out.println(graph.edges().size());'
        - 'graph.methods().stream().limit(5).forEach(method -> {'
        - '    System.out.println(method);'
        - '    System.out.println(graph.calleesOf(method));'
        - '});'
      explanation: >-
        AndroidAnalysis owns the Soot and FlowDroid lifecycle. CallGraphSnapshot
        stores detached method signatures and indexed edges, so callers can query
        reachability and shortest paths after the managed session closes.
    - label: Run taint analysis
      query: Load explicit source and sink definitions and retain a structured result after FlowDroid finishes.
      file: AnalyzeTaint.java
      pattern: Java
      thinking:
        - Explicit source/sink definitions
        - Completion status preserved
        - Findings and paths detached
      output:
        - 'SourceSinkConfiguration definitions ='
        - '    SourceSinkConfiguration.fromFile(Path.of("SourcesAndSinks.txt"));'
        - ''
        - 'TaintAnalysisResult result;'
        - 'try (AndroidAnalysis analysis = AndroidAnalysis.builder('
        - '        Path.of("app.apk"), Path.of("/android-sdk/platforms"))'
        - '        .sourcesAndSinks(definitions)'
        - '        .open()) {'
        - '    result = analysis.analyzeTaint();'
        - '}'
        - ''
        - 'System.out.println(result.status());'
        - 'for (TaintFinding finding : result.findings()) {'
        - '    System.out.println(finding.source().description());'
        - '    System.out.println(finding.sink().description());'
        - '    System.out.println(finding.path());'
        - '}'
      explanation: >-
        TaintAnalysisResult preserves both findings and completion status. Clients
        can distinguish success, failure, timeout, and cancellation instead of
        interpreting an empty finding list as proof that no flow exists.
